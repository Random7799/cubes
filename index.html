    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return activeFetch; },
            set: function(fn) { activeFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            var proto = Window.prototype;
            var protoFetch = proto.fetch;
            Object.defineProperty(proto, 'fetch', {
              get: function() { return protoFetch; },
              set: function(fn) { protoFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (_) {}
        }

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
